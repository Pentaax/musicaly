<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Musicaly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,800;9..144,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Barra de título customizada -->
  <div class="titlebar">
    <div class="titlebar-brand">
      <svg class="logo-icon" viewBox="0 0 24 24" fill="none">
        <path d="M9 18V5l12-2v13" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="6" cy="18" r="3" stroke="currentColor" stroke-width="2.5"/>
        <circle cx="18" cy="16" r="3" stroke="currentColor" stroke-width="2.5"/>
      </svg>
      <span>Musicaly</span>
    </div>
    <div class="titlebar-controls">
      <button class="tb-btn" id="btn-minimize" title="Minimizar">
        <svg viewBox="0 0 12 12"><rect x="2" y="5.5" width="8" height="1"/></svg>
      </button>
      <button class="tb-btn" id="btn-maximize" title="Maximizar">
        <svg viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8" fill="none" stroke="currentColor" stroke-width="1"/></svg>
      </button>
      <button class="tb-btn tb-close" id="btn-close" title="Fechar">
        <svg viewBox="0 0 12 12"><path d="M2 2 L10 10 M10 2 L2 10" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
    </div>
  </div>

  <div class="app">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <nav class="nav-primary">
        <button class="nav-item active" data-view="home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12L12 3l9 9"/><path d="M5 10v10h14V10"/></svg>
          <span>Início</span>
        </button>
        <button class="nav-item" data-view="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <span>Buscar</span>
        </button>
        <button class="nav-item" data-view="library">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18M8 3v18M13 3l8 18"/></svg>
          <span>Sua Biblioteca</span>
        </button>
      </nav>

      <div class="sidebar-divider"></div>

      <nav class="nav-secondary">
        <button class="nav-item" data-view="favorites">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7-4.5-9.5-9C1 9 2 5 6 5c2 0 3.5 1 6 3.5C14.5 6 16 5 18 5c4 0 5 4 3.5 7-2.5 4.5-9.5 9-9.5 9z"/></svg>
          <span>Curtidas</span>
        </button>
        <button class="nav-item" data-view="history">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          <span>Histórico</span>
        </button>
      </nav>

      <div class="sidebar-divider"></div>

      <div class="playlists-section">
        <div class="playlists-header">
          <span>Suas playlists</span>
          <button class="btn-icon" id="btn-new-playlist" title="Nova playlist">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
        <div class="playlists-list" id="playlists-list"></div>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main">
      <div class="topbar">
        <div class="search-wrapper" id="search-wrapper">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input type="text" id="search-input" placeholder="O que você quer ouvir hoje?" autocomplete="off">
        </div>
      </div>

      <div class="view-container" id="view-container">
        <!-- Conteúdo dinâmico -->
      </div>
    </main>
  </div>

  <!-- PLAYER -->
  <footer class="player">
    <div class="player-now-playing">
      <img id="np-thumb" src="" alt="" class="np-thumb hidden">
      <div class="np-info">
        <div class="np-title" id="np-title">Nenhuma música tocando</div>
        <div class="np-author" id="np-author">—</div>
      </div>
      <button class="btn-icon btn-like" id="btn-like" title="Curtir">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-4.5-9.5-9C1 9 2 5 6 5c2 0 3.5 1 6 3.5C14.5 6 16 5 18 5c4 0 5 4 3.5 7-2.5 4.5-9.5 9-9.5 9z"/></svg>
      </button>
    </div>

    <div class="player-controls">
      <div class="controls-buttons">
        <button class="btn-icon" id="btn-shuffle" title="Aleatório">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
        </button>
        <button class="btn-icon" id="btn-prev" title="Anterior">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="btn-play" id="btn-play">
          <svg id="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg id="icon-pause" class="hidden" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>
        </button>
        <button class="btn-icon" id="btn-next" title="Próxima">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6h2v12h-2z"/></svg>
        </button>
        <button class="btn-icon" id="btn-repeat" title="Repetir">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 1l4 4-4 4M3 11V9a4 4 0 014-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 01-4 4H3"/></svg>
        </button>
      </div>
      <div class="progress-wrapper">
        <span class="time" id="time-current">0:00</span>
        <div class="progress-bar" id="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
          <div class="progress-handle" id="progress-handle"></div>
        </div>
        <span class="time" id="time-total">0:00</span>
      </div>
    </div>

    <div class="player-extras">
      <button class="btn-icon" id="btn-lyrics" title="Letra">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      </button>
      <button class="btn-icon" id="btn-mute">
        <svg id="icon-volume" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 00-2.5-4v8a4.5 4.5 0 002.5-4zM14 3.2v2.1a7 7 0 010 13.4v2.1A9 9 0 0014 3.2z"/></svg>
        <svg id="icon-muted" class="hidden" viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 12A4.5 4.5 0 0014 8v2.18l2.45 2.45c.03-.2.05-.41.05-.63zM19 12c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.96 8.96 0 0021 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.17v2.06a8.99 8.99 0 003.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
      </button>
      <div class="volume-wrapper">
        <div class="volume-bar" id="volume-bar">
          <div class="volume-fill" id="volume-fill"></div>
        </div>
      </div>
    </div>
  </footer>

  <!-- MODAL: Nova playlist -->
  <div class="modal-backdrop hidden" id="modal-playlist">
    <div class="modal">
      <h2>Nova playlist</h2>
      <input type="text" id="new-playlist-name" placeholder="Nome da playlist" maxlength="50">
      <div class="modal-actions">
        <button class="btn-secondary" id="cancel-playlist">Cancelar</button>
        <button class="btn-primary" id="create-playlist">Criar</button>
      </div>
    </div>
  </div>

  <!-- MODAL: Letra -->
  <div class="modal-backdrop hidden" id="modal-lyrics">
    <div class="modal modal-lyrics">
      <div class="lyrics-header">
        <div>
          <h2 id="lyrics-title">Letra</h2>
          <p id="lyrics-author"></p>
        </div>
        <button class="btn-icon" id="close-lyrics">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="lyrics-content" id="lyrics-content"></div>
    </div>
  </div>

  <!-- Menu de contexto -->
  <div class="context-menu hidden" id="context-menu"></div>

  <!-- Toast -->
  <div class="toast hidden" id="toast"></div>

  <audio id="audio-player"></audio>

  <script src="js/storage.js"></script>
  <script src="js/player.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
